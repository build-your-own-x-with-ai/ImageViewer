name: image_viewer
description: "纯 Dart 手写图像解码器：BMP / PNG / JPEG / WebP / PNM / YUV"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

# 本项目的核心约束：不使用任何图像解码库。
#
# BMP / PNG / JPEG / WebP / PNM / YUV 六种格式全部从原始字节手写解码，
# 包括 zlib inflate、Huffman、IDCT、VP8 位流。也不用 dart:ui 的解码能力
# （只用 decodeImageFromPixels 把已经算好的 RGBA 交给 GPU）。
#
# 与解码无关的工具/资源包可以用。判断标准：这个包有没有替我们解析一个字节？
#   cupertino_icons —— 图标字体，只是资源文件
#   flutter_lints   —— 静态分析规则，只在开发期生效，不进产物
#   file_selector   —— 系统文件选择对话框。它只负责把 Uint8List 交到手上，
#                      一个字节也不解析。有了它 Web 端也能打开任意本地文件
#                      （只是拿不到路径，所以解码器入口一律是 Uint8List）
dependencies:
  cupertino_icons: ^1.0.9
  file_selector: ^1.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # 打包进 App 的样图。移动端与 Web 拿不到本地文件系统，
    # 只能靠这些内置样图，所以它们是这些平台上唯一的图片来源。
    - assets/samples/
